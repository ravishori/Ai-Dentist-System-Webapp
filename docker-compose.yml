services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalcare
      POSTGRES_PASSWORD: dentalcare
      POSTGRES_DB: dentalcare
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalcare -d dentalcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dentalcare_pg_data:/var/lib/postgresql/data

volumes:
  dentalcare_pg_data:
